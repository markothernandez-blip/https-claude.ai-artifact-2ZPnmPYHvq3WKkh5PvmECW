<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marco Hernandez · Un año de cambios</title>
<style>
:root{
  --bg1:#c8552b; --bg2:#7a3b22; --bg3:#2f8f8a;
  --card:#f7f4f4; --ink:#111; --coral:#f0545e; --pill:#d3d6dc; --frame:#8b4dff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --card:#1f1b1b; --ink:#f5f1f1; --pill:#3a3d44; }
}
:root[data-theme="dark"]{ --card:#1f1b1b; --ink:#f5f1f1; --pill:#3a3d44; }
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
  padding:18px 14px 28px; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 85% 10%, #f2a03a 0 12%, transparent 30%),
    radial-gradient(circle at 10% 95%, var(--bg3) 0 10%, transparent 32%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed; color:var(--ink);
}
.frame{width:100%;max-width:420px;border:3px solid var(--frame);border-radius:6px;padding:12px}
.card{background:var(--card);border-radius:22px;padding:14px 16px 24px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.top{display:flex;justify-content:space-between;color:var(--coral);font-size:1.05rem}
h1{font-size:1.75rem;margin:10px 0 2px;font-weight:800;letter-spacing:-.5px}
.name{font-size:.9rem;opacity:.7;margin-bottom:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.75rem;
  border-bottom:1px solid rgba(128,128,128,.3);padding-bottom:6px}
.days span.today{color:#fff;background:var(--coral);border-radius:50%;font-weight:700;width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;margin:0 auto}
.days b{font-weight:700}
.collage{position:relative;height:430px;margin-top:14px}
.pol{position:absolute;background:#fff;padding:5px 5px 5px;box-shadow:0 5px 14px rgba(0,0,0,.3);
  transition:transform .25s}
.pol:active{transform:scale(1.06) rotate(0)!important}
.pol img{display:block;width:100%;height:100%;object-fit:cover}
.p1{width:44%;height:150px;left:0;top:6px;transform:rotate(-3deg)}
.p1 i{background:linear-gradient(135deg,#f2a03a,#e0457b 45%,#2f8f8a)}
.p2{width:40%;height:140px;right:0;top:0;transform:rotate(1.5deg)}
.p2 i{background:linear-gradient(160deg,#8b4dff,#f0545e 60%,#f2c53a)}
.p3{width:48%;height:150px;left:6%;top:208px;transform:rotate(3deg)}
.p3 i{background:linear-gradient(140deg,#2f8f8a,#9fd36b 55%,#f2c53a)}
.p4{width:40%;height:150px;right:2%;top:230px;transform:rotate(-2deg)}
.p4 i{background:linear-gradient(180deg,#7fd0e8,#f6e3b0 70%,#d99a54)}
.warn{position:absolute;right:2%;top:150px;width:52px;height:52px;
  image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #000)}
.pill{position:absolute;display:block;text-align:center;background:var(--pill);color:var(--ink);
  font-size:.72rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;text-decoration:underline;
  padding:9px 0;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s}
.pill:active{transform:scale(.94)}
.b-fb{width:42%;left:1%;top:150px}
.b-tk{width:34%;right:20%;top:150px;display:none}
.links{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.links .pill{position:static;font-size:.85rem;padding:14px 0;border-radius:26px}
</style>
</head>

<script>
  // Fila de días estilo calendario, resaltando el día de hoy
  var d = ['S','M','T','W','T','F','S'], t = new Date().getDay(), box = document.getElementById('days');
  d.forEach(function(l,i){
    var s = document.createElement('span');
    if(i===t){ s.className='today'; } else if(i===1){ s.innerHTML='<b>'+l+'</b>'; }
    if(i===t){ s.textContent=l; }
    if(i!==t && i!==1){ s.textContent=l; }
    box.appendChild(s);
  });
</script>
